{% extends "base.html" %}

{% block content %}

<h2>My Profile</h2>

{% if user.profile_picture %}

<img src="{{ user.profile_picture.url }}"
     width="150"
     class="rounded-circle">

{% endif %}

<h4>{{ user.username }}</h4>

<p>{{ user.email }}</p>

<p>{{ user.phone_number }}</p>

<p>{{ user.bio }}</p>

<p>{{ user.role }}</p>

<a href="{% url 'edit_profile' %}"
   class="btn btn-warning">

Edit Profile

</a>

{% endblock %}
